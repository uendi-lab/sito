<!-- Contatti Section -->
<section class="contacts">
  <!-- Colonna sinistra -->
  <div class="contact-left">
    <div class="contact-box">
      <img src="img/logo.jpg" alt="Logo Studio Albini" class="contact-logo" />

      <div class="contact-info">
        <h2>PIETRO ALBINI</h2>
        <p>Architetto Professionista</p>

        <div class="contact-data">
          <p>📞 +39 3331016322</p>
          <p>✉️ info@pietroalbini.it</p>
          <p>📍 Via Papa Giovanni XXIII 24, Ello (LC)</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Colonna destra -->
  <div class="contact-right">
    <div class="contact-detail">
      <div class="contact-form-box">
        <h3>Richiedi una consulenza</h3>

        <form id="contactForm" class="contact-form">
          <div class="form-group">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" required class="form-input">
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required class="form-input">
          </div>

          <div class="form-group">
            <label for="oggetto">Oggetto</label>
            <input type="text" id="oggetto" name="oggetto" required class="form-input">
          </div>

          <div class="form-group">
            <label for="messaggio">Messaggio</label>
            <textarea id="messaggio" name="messaggio" required class="form-input"></textarea>
          </div>

          <button type="submit" class="btn btn-primary">Invia</button>
          <div id="formMessage" style="margin-top:10px;"></div>
        </form>
      </div>
    </div>
  </div>
</section>
