<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Studio di Architettura</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      color: #333;
      background-size: cover;
      background-position: center;
      animation: slideshow 15s infinite;
      z-index: 0;
    }
    header {
      position: fixed;
      width: 100%;
      max-width: 100%;
      background-color: transparent;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      z-index: 1000;
      overflow-x: hidden;
    }
    .logo {
      font-size: 1.2rem;
      height: 80px;
      width: 80px;
      opacity: 1;
    }
    nav {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      flex-shrink: 1;
    }
    nav a {
      text-decoration: none;
      color: hsl(0, 0%, 100%) !important;
      font-weight: 500;
      transition: color 0.3s ease;
    }
    nav a:hover {
      color: #ddd;
    }
    .hero {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
      position: relative;
    }
    @keyframes slideshow {
      0%   { background-image: url('img/progetto1.jpg'); }
      33%  { background-image: url('img/progetto2.jpg'); }
      66%  { background-image: url('img/progetto3.jpg'); }
      100% { background-image: url('img/bg1.jpg'); }
    }
    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
    }
    .hero-content {
      position: relative;
      z-index: 1;
    }
    .hero h1 {
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }
    .hero p {
      font-size: 1.2rem;
    }
    section {
      padding: 5rem 2rem;
      max-width: 1200px;
      margin: auto;
    }
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
    }
    .project-card {
      background-color: #f9f9f9;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      transition: transform 0.3s;
    }
    .project-card:hover {
      transform: translateY(-5px);
    }
    .project-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }
    .project-card h3 {
      margin: 1rem;
      font-size: 1.1rem;
    }
    footer::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }
    footer {
      position: relative;
      z-index: 1;
      color:hsl(0, 0%, 100%);
      text-align: center;
      padding: 5px;
    }
    img {
      max-width: 100%;
      height: auto;
    }

    /* Hamburger icon */
    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      position: absolute;
      top: 1.5rem;
      right: 2rem;
      z-index: 1100;
      width: 25px;
      height: 20px;
      justify-content: center;
      transition: opacity 0.3s ease;
    }
    .hamburger div {
      width: 25px;
      height: 3px;
      background-color: white;
      border-radius: 2px;
      transition: all 0.3s ease;
    }

    /* Nascondi hamburger quando menu aperto */
    .hamburger.open {
      display: none;
    }

    /* Nascondi close-btn su desktop */
    .close-btn {
      display: none;
    }

    /* Responsive and sidebar styles */
    @media (max-width: 768px) {
      header {
        flex-direction: row;
        align-items: center;
        padding: 1rem 1.5rem;
      }

      .logo {
        height: 60px;
        width: 60px;
      }

      .hero h1 {
        font-size: 2rem;
      }

      .hero p {
        font-size: 1rem;
        padding: 0 1rem;
      }

      .projects-grid {
        grid-template-columns: 1fr;
      }

      .hamburger {
        display: flex;
      }

      /* Sidebar nav */
      nav {
        position: fixed;
        top: 0;
        right: -250px;
        width: 250px;
        height: 100vh;
        background-color: white;
        color: black;
        flex-direction: column;
        padding: 3rem 1.5rem;
        box-shadow: -2px 0 5px rgba(0,0,0,0.2);
        transition: right 0.3s ease;
        z-index: 1050;
        display: flex;
        gap: 1.5rem;
      }

      nav.open {
        right: 0;
      }

      nav a {
        color: black !important;
        padding: 0.75rem 0;
        font-size: 1.2rem;
        display: block;
        border-bottom: 1px solid #ddd;
      }

      /* Mostra close-btn solo su mobile */
      .close-btn {
        display: block;
        position: absolute;
        top: 1rem;
        right: 1.5rem;
        font-size: 2rem;
        cursor: pointer;
        color: black;
        user-select: none;
      }
    }
  </style>
</head>
<body>
  <header>
    <img src="img/logo.jpg" alt="Logo Studio Albini" class="logo" />
    <div class="hamburger" onclick="toggleMenu()">
      <div></div>
      <div></div>
      <div></div>
    </div>
    <nav>
      <div class="close-btn" onclick="toggleMenu()">&#10005;</div> <!-- X per chiudere -->
      <a href="chi-siamo.html" onclick="toggleMenu()">Chi siamo</a>
      <a href="progetti2.html" onclick="toggleMenu()">Progetti</a>
      <a href="#servizi" onclick="toggleMenu()">Servizi</a>
      <a href="#contatti" onclick="toggleMenu()">Contatti</a>
    </nav>
  </header>

  <div class="hero">
    <div class="hero-content">
      <h1>Pietro Albini Geometra</h1>
      <p>Design contemporaneo, materiali naturali, spazi che parlano.</p>
    </div>
  </div>

  <script>
    function toggleMenu() {
      const nav = document.querySelector('nav');
      const hamburger = document.querySelector('.hamburger');
      nav.classList.toggle('open');
      hamburger.classList.toggle('open');
    }
  </script>
</body>
</html>
